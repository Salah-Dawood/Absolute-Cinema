services:
  mongo:
    image: mongo:7.0
    container_name: cinemasaar-queue-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - queue-mongo-data:/data/db

  # MongoDB transactions need a replica set. This one-off container initiates
  # the single node once mongo is healthy, then exits.
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --eval
      - |
        try {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
        } catch (e) {
          print(e);
        }
    restart: "no"

volumes:
  queue-mongo-data:
