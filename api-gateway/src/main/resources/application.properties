server.port=8000

spring.application.name=api-gateway
spring.main.web-application-type=reactive

# Must be the SAME value as in auth-service
jwt.secret=${JWT_SECRET}

# Frontend origin(s) allowed to call the API from the browser (comma-separated)
cors.allowed-origins=${FRONTEND_URL:http://localhost:8080,http://localhost:5173,http://localhost:3000}

# Where each service runs.
# Locally: localhost + port. In docker-compose: override with the container name,
# e.g. AUTH_SERVICE_URL=http://auth-service:8081
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.movie.url=${MOVIE_SERVICE_URL:http://localhost:8082}
services.recommendation.url=${RECOMMENDATION_SERVICE_URL:http://localhost:8083}
services.queue.url=${QUEUE_SERVICE_URL:http://localhost:8084}
services.seat-reservation.url=${SEAT_RESERVATION_SERVICE_URL:http://localhost:8085}
services.booking-management.url=${BOOKING_MANAGEMENT_SERVICE_URL:http://localhost:8086}
services.audit.url=${AUDIT_SERVICE_URL:http://localhost:8087}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8088}
