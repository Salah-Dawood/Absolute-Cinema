spring.application.name=auth-service
server.port=8081
spring.data.mongodb.uri=${MONGO_DB}

spring.data.mongodb.database=movie_db
# Creates the unique index on User.email automatically
spring.data.mongodb.auto-index-creation=true

# Must be the SAME value in api-gateway. At least 32 characters.
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (default 24h)
jwt.expiration-ms=86400000

# Optional: creates an ADMIN account on startup if it doesn't exist yet
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}